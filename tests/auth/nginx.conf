# Path: tests/auth/nginx.conf
# 機能: 内部ネットワーク専用のHTTPS→PHP-FPM転送。共有コード/設定/テストはWeb外。
server {
    listen 443 ssl;
    server_name web;
    ssl_certificate /etc/nginx/lab/tls.crt;
    ssl_certificate_key /etc/nginx/lab/tls.key;
    root /srv/web;
    index index.php;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass app:9000;
    }
}
